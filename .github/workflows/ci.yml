# Comprobaciones básicas en cada PR contra main (también las de Dependabot) y en cada push a main: tipos, lint,
# pruebas unitarias y traducciones. No necesita base de datos ni secretos; las pruebas con base (`npm run test:db`), el
# build de producción y las e2e se siguen pasando en local antes de fusionar (docs/HANDOFF.md §4).
name: Comprobaciones

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma PR cancela la pasada anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tipos, lint, pruebas y traducciones
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma lo pide al leer prisma.config.ts; aquí no se conecta a ninguna base.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Cliente de Prisma
        run: npx prisma generate

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Traducciones
        run: npm run i18n:check
