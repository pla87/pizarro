# Comprobaciones en cada PR contra main (también las de Dependabot): tipos, lint, pruebas unitarias y traducciones, y
# en otro job las pruebas con base (`npm run test:db`, en un PostgreSQL 16 del propio runner, en orden al azar). Sin
# secretos. El build de producción y las e2e se siguen pasando en local antes de fusionar (docs/HANDOFF.md §4).
# Sin pasada al hacer push a main: la de la PR prueba su mezcla con el main de ese momento. Si main avanza después
# (otra PR fusionada), el main que resulta no lo ha probado nadie: «Update branch» en la PR repite la pasada, y la release
# (.github/workflows/release.yml) vuelve a pasar las de los jobs «checks» y «db» sobre el commit que publica antes de
# etiquetar nada (sus jobs del mismo nombre, con los mismos pasos: tests/release-pipeline.test.ts lo comprueba).
# A mano: Actions → Comprobaciones → Run workflow.
name: Comprobaciones

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma PR cancela la pasada anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tipos, lint, pruebas y traducciones
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma lo pide al leer prisma.config.ts; aquí no se conecta a ninguna base.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Cliente de Prisma
        run: npx prisma generate

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Traducciones
        run: npm run i18n:check

  caddyfile:
    # El Caddyfile de deploy/ solo se prueba de verdad en un servidor; aquí se valida con la misma imagen de Caddy
    # que fija deploy/compose.yml (por digest), en modo solo HTTP y con un dominio, sin pedir certificados.
    name: Caddyfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar deploy/Caddyfile
        run: |
          image=$(grep -Eo 'caddy:[^ ]+@sha256:[0-9a-f]{64}' deploy/compose.yml | head -1)
          test -n "$image" || { echo "No encuentro la imagen de Caddy en deploy/compose.yml"; exit 1; }
          for domain in ":80" "pizarro.example.com"; do
            docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e DOMAIN="$domain" "$image" \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done

  db:
    # Las pruebas con PostgreSQL (tests/db/), con los ficheros en orden al azar (--shuffle): así salen las pruebas que
    # solo pasan por el orden. Si falla, el log dice la semilla para repetirlo en local (npm run test:db -- --shuffle=N).
    name: Pruebas con base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Solo el servidor: test:db crea y borra sus propias bases pizarro_test_*.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Cliente de Prisma
        run: npx prisma generate

      # Bases desechables: el PostgreSQL del servicio y sus bases pizarro_test_* se tiran al acabar el job, así que se
      # apagan el fsync y las escrituras completas de página (más rápido; si el servidor se cae, no se pierde nada).
      - name: PostgreSQL sin esperas de disco (base desechable)
        run: >-
          node -e "const { Client } = require('pg'); (async () => { const c = new Client({ connectionString: process.env.DATABASE_URL }); await c.connect();
          for (const s of ['fsync = off', 'synchronous_commit = off', 'full_page_writes = off']) await c.query('ALTER SYSTEM SET ' + s);
          await c.query('SELECT pg_reload_conf()'); await c.end(); })().catch((e) => { console.error(e); process.exit(1); })"

      - name: Pruebas con base de datos (orden al azar)
        env:
          TEST_DB_JOBS: 4
        run: npm run test:db -- --shuffle

