# Al subir una etiqueta vX.Y.Z (npm run release:tag + git push origin vX.Y.Z):
#   1. construye la imagen Docker (linux/amd64 y linux/arm64) y la publica en GHCR
#      como ghcr.io/pla87/pizarro:X.Y.Z y :latest;
#   2. crea la GitHub Release con las notas de esa versión tomadas de changelog.json;
#   3. mueve la rama «stable» a ese commit (solo versiones X.Y.Z sin sufijo, de commits que están en main y nunca
#      hacia atrás; con el secreto opcional STABLE_PUSH_TOKEN si la versión cambia .github/workflows/). Railway y quien
#      construya desde el código siguen «stable»: así nadie recibe commits sueltos de main, solo versiones publicadas.
# La release se crea al final: si la imagen falla, no se anuncia una versión que no se puede instalar.
# Las acciones van fijadas a un commit exacto (SHA de 40 caracteres, con su versión en el comentario); Dependabot
# propone las actualizaciones (.github/dependabot.yml, revisión en docs/HANDOFF.md).
# También se puede lanzar a mano (Actions → Release → Run workflow, rama main): publica la versión de
# package.json de ese commit y crea la etiqueta vX.Y.Z junto con la release. A mano solo desde main: lanzado desde
# otra rama, los jobs no se ejecutan (no se publica nada). Si esa versión ya tiene etiqueta vX.Y.Z, se para con un
# error sin publicar nada: hay que subir la versión (npm run version:bump).
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Un solo grupo para todas: la ejecución por etiqueta y la lanzada a mano (que tienen distinto github.ref) no corren
# a la vez publicando la misma versión.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    name: Imagen Docker
    runs-on: ubuntu-latest
    # Con etiqueta, siempre; a mano, solo desde main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Comprobar que la etiqueta coincide con package.json
        run: |
          pkg="$(node -p "require('./package.json').version")"
          # A mano (workflow_dispatch) la versión es la de package.json; con etiqueta, deben coincidir.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag="$pkg"; else tag="${GITHUB_REF_NAME#v}"; fi
          case "$pkg" in *[!0-9A-Za-z.-]*|"") echo "Versión de package.json no válida: $pkg" >&2; exit 1 ;; esac
          if [ "$tag" != "$pkg" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión de package.json ($pkg)." >&2
            exit 1
          fi
          # A mano con una versión ya etiquetada se volverían a publicar :X.Y.Z y :latest con otro commit (y luego
          # fallaría al crear la release): se para antes de construir nada.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! existing="$(git ls-remote --tags origin "refs/tags/v$pkg")"; then
              echo "No se pudo consultar las etiquetas del repositorio." >&2
              exit 1
            fi
            if [ -n "$existing" ]; then
              echo "La versión $pkg ya está publicada (existe la etiqueta v$pkg); sube la versión con npm run version:bump." >&2
              exit 1
            fi
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: tags
        run: |
          # «latest» solo para versiones estables (X.Y.Z); una etiqueta con sufijo no lo mueve.
          tags="ghcr.io/pla87/pizarro:${VERSION}"
          case "$VERSION" in *[!0-9.]*) ;; *) tags="$tags,ghcr.io/pla87/pizarro:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # OFFICIAL_BUILD + RELEASE_VERSION marcan la imagen como build oficial (next.config.ts): solo entonces la app
          # muestra «Informar de un error». Cualquiera puede pasarlas al construir: es una pista, no una garantía.
          build-args: |
            GIT_SHA=${{ github.sha }}
            OFFICIAL_BUILD=1
            RELEASE_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/pla87/pizarro
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Versión
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          else
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Notas de la versión (changelog.json)
        run: node scripts/release-notes.mjs "$TAG" > release-notes.md

      - name: Crear la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Crea la etiqueta en este commit junto con la release.
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Pizarro $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "Pizarro $TAG" --notes-file release-notes.md --verify-tag
          fi

  stable:
    name: Rama stable
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    # Lo único que escribe en el repositorio desde aquí: mover refs/heads/stable. Si este job falla, la imagen y la
    # release ya están publicadas (jobs anteriores) y no se tocan: basta con arreglarlo y relanzar solo este job.
    permissions:
      contents: write
    steps:
      # GITHUB_TOKEN no puede actualizar una rama si entre su commit viejo y el nuevo cambia algo de .github/workflows/
      # (GitHub lo rechaza: «refusing to allow a GitHub App to create or update workflow … without `workflows`
      # permission», y `permissions:` no admite `workflows`). Para esas versiones hace falta el secreto opcional
      # STABLE_PUSH_TOKEN: un token fine-grained solo de este repositorio con Contents y Workflows en lectura y escritura
      # (docs/HANDOFF.md, «Cerrar una versión»). Sin él se usa GITHUB_TOKEN, que basta mientras no cambien los workflows.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.STABLE_PUSH_TOKEN || github.token }}
          # Historia completa: hace falta para comprobar que el commit publicado está en main.
          fetch-depth: 0

      - name: Mover stable a la versión publicada
        env:
          HAS_STABLE_PUSH_TOKEN: ${{ secrets.STABLE_PUSH_TOKEN != '' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *[!0-9.]*) echo "$version es una preversión: stable no se mueve."; exit 0 ;;
          esac
          # Solo commits que ya están en main: una etiqueta puesta en otra rama (o en un commit suelto) no llega a stable.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::warning::$GITHUB_SHA no está en main: stable no se mueve (la release y la imagen ya están publicadas)."
            exit 0
          fi
          # Commit actual de stable (vacío si aún no existe).
          current="$(git ls-remote origin refs/heads/stable | cut -f1)"
          if [ "$current" = "$GITHUB_SHA" ]; then echo "stable ya está en $GITHUB_SHA."; exit 0; fi
          if [ -n "$current" ]; then
            git cat-file -e "$current^{commit}" 2>/dev/null || git fetch --no-tags origin "$current"
            prev="$(git show "$current:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")"
            # Nunca hacia atrás: publicar una corrección de una versión antigua no debe bajar a nadie de versión.
            newer="$(node -e "const p=v=>v.split('.').map(Number);const [a,b]=[p(process.argv[1]),p(process.argv[2])];let c=0;for(let i=0;i<3&&!c;i++)c=a[i]-b[i];console.log(c>0?1:0)" "$version" "$prev")"
            if [ "$newer" != 1 ]; then echo "stable ya tiene la $prev (>= $version): no se mueve."; exit 0; fi
          fi
          # --force-with-lease con el commit leído arriba: si otro proceso la movió entretanto, falla en vez de pisarla.
          # Con «current» vacío exige que la rama no exista todavía.
          if ! git push --force-with-lease="refs/heads/stable:$current" origin "$GITHUB_SHA:refs/heads/stable" 2> push.err; then
            cat push.err >&2
            if grep -qi "workflow" push.err; then
              if [ "$HAS_STABLE_PUSH_TOKEN" = "true" ]; then
                msg="GitHub rechaza mover stable porque cambian ficheros de .github/workflows/ y el secreto STABLE_PUSH_TOKEN no tiene el permiso Workflows (lectura y escritura) en este repositorio."
              else
                msg="GitHub rechaza mover stable con GITHUB_TOKEN porque esta versión cambia ficheros de .github/workflows/. Crea el secreto STABLE_PUSH_TOKEN (token fine-grained solo de este repositorio con Contents y Workflows en lectura y escritura; pasos en docs/HANDOFF.md) y relanza este job."
              fi
              echo "::error::$msg La imagen y la release de v$version ya están publicadas: solo falta stable."
              echo "### stable no se ha movido" >> "$GITHUB_STEP_SUMMARY"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::No se pudo mover stable (ver el error de git arriba). La imagen y la release de v$version ya están publicadas."
            fi
            exit 1
          fi
          echo "stable → $GITHUB_SHA (v$version)."
