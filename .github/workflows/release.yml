# Al subir una etiqueta vX.Y.Z (npm run release:tag + git push origin vX.Y.Z):
#   1. construye la imagen Docker (linux/amd64 y linux/arm64) y la publica en GHCR
#      como ghcr.io/pla87/pizarro:X.Y.Z y :latest;
#   2. crea la GitHub Release con las notas de esa versión tomadas de changelog.json.
# La release se crea al final: si la imagen falla, no se anuncia una versión que no se puede instalar.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Imagen Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que la etiqueta coincide con package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión de package.json ($pkg)." >&2
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: tags
        run: |
          # «latest» solo para versiones estables (X.Y.Z); una etiqueta con sufijo no lo mueve.
          tags="ghcr.io/pla87/pizarro:${VERSION}"
          case "$VERSION" in *[!0-9.]*) ;; *) tags="$tags,ghcr.io/pla87/pizarro:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/pla87/pizarro
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Notas de la versión (changelog.json)
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - name: Crear la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Pizarro $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
