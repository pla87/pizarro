# Al subir una etiqueta vX.Y.Z (npm run release:tag + git push origin vX.Y.Z):
#   1. construye la imagen Docker, cada arquitectura en su máquina nativa (linux/amd64 en ubuntu-latest y linux/arm64
#      en ubuntu-24.04-arm, sin QEMU), sube cada una por su digest y las une en ghcr.io/pla87/pizarro:X.Y.Z y :latest;
#   2. crea la GitHub Release con las notas de esa versión tomadas de changelog.json y le adjunta MANUAL.pdf y
#      PRUEBAS.pdf, generados aquí desde docs/MANUAL.md y docs/PRUEBAS.md (no están en el repositorio; la web y el README
#      enlazan a releases/latest/download/MANUAL.pdf);
#   3. mueve la rama «stable» a ese commit (solo versiones X.Y.Z sin sufijo, de commits que están en main y nunca
#      hacia atrás; con el secreto opcional STABLE_PUSH_TOKEN si la versión cambia .github/workflows/; lógica en
#      scripts/move-stable.sh, compartida con .github/workflows/stable.yml). Railway y quien construya desde el código
#      siguen «stable»: así nadie recibe commits sueltos de main, solo versiones publicadas.
# La release se crea al final: si la imagen falla, no se anuncia una versión que no se puede instalar.
# Antes de etiquetar nada, el job «Comprobaciones» pasa sobre este mismo commit los tipos, el lint, las pruebas unitarias
# y las traducciones (como .github/workflows/ci.yml): un commit de main que nadie probó (dos PR fusionadas una detrás de
# otra) no se publica.
# Las acciones van fijadas a un commit exacto (SHA de 40 caracteres, con su versión en el comentario); Dependabot
# propone las actualizaciones (.github/dependabot.yml, revisión en docs/HANDOFF.md).
# También se puede lanzar a mano (Actions → Release → Run workflow, rama main): publica la versión de
# package.json de ese commit y crea la etiqueta vX.Y.Z junto con la release. A mano solo desde main: lanzado desde
# otra rama, los jobs no se ejecutan (no se publica nada). Si esa versión ya tiene etiqueta vX.Y.Z, se para con un
# error sin publicar nada: hay que subir la versión (npm run version:bump).
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Un solo grupo para todas: la ejecución por etiqueta y la lanzada a mano (que tienen distinto github.ref) no corren
# a la vez publicando la misma versión.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Versión
    runs-on: ubuntu-latest
    # Con etiqueta, siempre; a mano, solo desde main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comprobar que la etiqueta coincide con package.json
        id: version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          # A mano (workflow_dispatch) la versión es la de package.json; con etiqueta, deben coincidir.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag="$pkg"; else tag="${GITHUB_REF_NAME#v}"; fi
          case "$pkg" in *[!0-9A-Za-z.-]*|"") echo "Versión de package.json no válida: $pkg" >&2; exit 1 ;; esac
          if [ "$tag" != "$pkg" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión de package.json ($pkg)." >&2
            exit 1
          fi
          # A mano con una versión ya etiquetada se volverían a publicar :X.Y.Z y :latest con otro commit (y luego
          # fallaría al crear la release): se para antes de construir nada.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! existing="$(git ls-remote --tags origin "refs/tags/v$pkg")"; then
              echo "No se pudo consultar las etiquetas del repositorio." >&2
              exit 1
            fi
            if [ -n "$existing" ]; then
              echo "La versión $pkg ya está publicada (existe la etiqueta v$pkg); sube la versión con npm run version:bump." >&2
              exit 1
            fi
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Etiquetas de la imagen
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # «latest» solo para versiones estables (X.Y.Z); una etiqueta con sufijo no lo mueve.
          tags="ghcr.io/pla87/pizarro:${VERSION}"
          case "$VERSION" in *[!0-9.]*) ;; *) tags="$tags,ghcr.io/pla87/pizarro:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  # Lo mismo que el job «checks» de ci.yml (sin base de datos ni secretos), sobre el commit que se publica. Va en paralelo
  # con las imágenes y los PDF; «Imagen Docker» lo espera, así que si falla no se etiqueta ni se publica nada.
  checks:
    name: Comprobaciones
    needs: version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Prisma lo pide al leer prisma.config.ts; aquí no se conecta a ninguna base.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Cliente de Prisma
        run: npx prisma generate

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Traducciones
        run: npm run i18n:check

  # Cada arquitectura se construye en una máquina nativa (sin emular con QEMU, que era lo más lento) y se sube a GHCR
  # solo por su digest, sin etiqueta. El job «Imagen Docker» las une después en una sola imagen con las etiquetas.
  build:
    name: Imagen ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      # Si falla una arquitectura no tiene sentido seguir con la otra: no se publicará ninguna etiqueta.
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          # Sin etiquetas: la imagen de esta arquitectura se sube solo por su digest.
          outputs: type=image,name=ghcr.io/pla87/pizarro,push-by-digest=true,name-canonical=true,push=true
          # OFFICIAL_BUILD + RELEASE_VERSION marcan la imagen como build oficial (next.config.ts): solo entonces la app
          # muestra «Informar de un error». Cualquiera puede pasarlas al construir: es una pista, no una garantía.
          build-args: |
            GIT_SHA=${{ github.sha }}
            OFFICIAL_BUILD=1
            RELEASE_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/pla87/pizarro
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Guardar el digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "La construcción no devolvió un digest: «$DIGEST»." >&2; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # MANUAL.pdf y PRUEBAS.pdf de esta versión (scripts/build-manual-pdf.mjs con el Chrome que trae el runner), en paralelo
  # con las imágenes. «Imagen Docker» los espera: si no se pueden generar, no se etiqueta ni se publica nada.
  pdf:
    name: Manual en PDF
    needs: version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Solo hacen falta marked y playwright-core (sin descargar navegadores: se usa el Chrome del runner).
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Generar MANUAL.pdf y PRUEBAS.pdf
        run: |
          # El script usa el Chrome de CHROME_PATH; las máquinas Ubuntu de GitHub traen Google Chrome (CHROME_BIN).
          CHROME_PATH="${CHROME_BIN:-$(command -v google-chrome || command -v google-chrome-stable || true)}"
          if [ -z "$CHROME_PATH" ] || [ ! -x "$CHROME_PATH" ]; then echo "No hay Chrome en el runner (CHROME_BIN vacío)." >&2; exit 1; fi
          export CHROME_PATH
          node scripts/build-manual-pdf.mjs
          node scripts/build-manual-pdf.mjs pruebas
          for f in MANUAL.pdf PRUEBAS.pdf; do
            if [ "$(head -c 5 "$f" 2>/dev/null)" != "%PDF-" ]; then echo "$f no se ha generado bien." >&2; exit 1; fi
            ls -l "$f"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manuales
          path: |
            MANUAL.pdf
            PRUEBAS.pdf
          if-no-files-found: error
          retention-days: 1

  image:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: [version, build, pdf, checks]
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      TAGS: ${{ needs.version.outputs.tags }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Une las dos arquitecturas en una sola imagen (índice multiplataforma) con las etiquetas :X.Y.Z (y :latest).
      - name: Unir linux/amd64 y linux/arm64 y etiquetar
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -- *
          count=$#
          if [ "$count" != 2 ]; then echo "Se esperaban 2 digests (amd64 y arm64) y hay $count." >&2; exit 1; fi
          args=()
          IFS=, read -ra taglist <<< "$TAGS"
          for t in "${taglist[@]}"; do args+=(-t "$t"); done
          for d in *; do args+=("ghcr.io/pla87/pizarro@sha256:$d"); done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/pla87/pizarro" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            "${args[@]}"

      - name: Comprobar la imagen publicada
        run: |
          docker buildx imagetools inspect "ghcr.io/pla87/pizarro:$VERSION"
          platforms="$(docker buildx imagetools inspect "ghcr.io/pla87/pizarro:$VERSION" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
          for p in linux/amd64 linux/arm64; do
            case " $platforms " in *" $p "*) ;; *) echo "Falta $p en la imagen publicada ($platforms)." >&2; exit 1 ;; esac
          done

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versión
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          else
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Notas de la versión (changelog.json)
        run: node scripts/release-notes.mjs "$TAG" > release-notes.md

      # Los PDF del job «Manual en PDF»: se adjuntan al crear la release, así que nunca hay una release sin ellos.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manuales
          path: ${{ runner.temp }}/manuales

      - name: Crear la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PDFS: ${{ runner.temp }}/manuales
        run: |
          for f in MANUAL.pdf PRUEBAS.pdf; do [ -s "$PDFS/$f" ] || { echo "Falta $f." >&2; exit 1; }; done
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Crea la etiqueta en este commit junto con la release.
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Pizarro $TAG" --notes-file release-notes.md \
              "$PDFS/MANUAL.pdf" "$PDFS/PRUEBAS.pdf"
          else
            gh release create "$TAG" \
              --title "Pizarro $TAG" --notes-file release-notes.md --verify-tag \
              "$PDFS/MANUAL.pdf" "$PDFS/PRUEBAS.pdf"
          fi

  stable:
    name: Rama stable
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    # Lo único que escribe en el repositorio desde aquí: mover refs/heads/stable. Si este job falla, la imagen y la
    # release ya están publicadas (jobs anteriores) y no se tocan: basta con arreglarlo y relanzar solo este job, o
    # usar Actions → Mover stable → Run workflow (.github/workflows/stable.yml), que mueve stable a la última versión.
    permissions:
      contents: write
    steps:
      # El checkout y las lecturas usan siempre github.token: un STABLE_PUSH_TOKEN caducado o mal creado no debe romper
      # el checkout («could not read Username … terminal prompts disabled»). El PAT solo se usa para el push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ github.token }}
          # Historia completa: hace falta para comprobar que el commit publicado está en main.
          fetch-depth: 0

      # GITHUB_TOKEN no puede actualizar una rama si entre su commit viejo y el nuevo cambia algo de .github/workflows/
      # (GitHub lo rechaza: «refusing to allow a GitHub App to create or update workflow … without `workflows`
      # permission», y `permissions:` no admite `workflows`). Para esas versiones hace falta el secreto opcional
      # STABLE_PUSH_TOKEN: un token fine-grained solo de este repositorio con Contents y Workflows en lectura y escritura
      # (docs/HANDOFF.md, «Cerrar una versión»). Sin él se usa GITHUB_TOKEN, que basta mientras no cambien los workflows.
      # Este paso comprueba el token (sin mostrarlo) y, si no vale, dice por qué y cómo crearlo bien.
      - name: Comprobar STABLE_PUSH_TOKEN
        env:
          STABLE_PUSH_TOKEN: ${{ secrets.STABLE_PUSH_TOKEN }}
        run: bash scripts/move-stable.sh check-token

      - name: Mover stable a la versión publicada
        env:
          STABLE_PUSH_TOKEN: ${{ secrets.STABLE_PUSH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/move-stable.sh move "$GITHUB_SHA"
