# Web del producto (getpizarro.com): genera el sitio estático con scripts/build-site.mjs (site/ → site/dist) y lo
# publica en GitHub Pages.
#
# IMPORTANTE (una sola vez, el propietario del repositorio): activar Pages en GitHub con
#   Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Sin eso, el paso de despliegue falla. El dominio (CNAME getpizarro.com), el DNS y «Enforce HTTPS» se explican en
# docs/VENTA.md, sección «Web getpizarro.com».
name: Web

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.mjs"
      - "LICENSE*.md"
      - "src/lib/product.ts"
      - "src/lib/landing-content.ts"
      - "src/lib/site-content.ts"
      - "src/lib/site-markdown.ts"
      - "src/lib/html-escape.ts"
      - "src/lib/search-accents.ts"
      - "docs/guias/**"
      - "docs/web/**"
      - "src/i18n/en/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Lo mínimo por defecto; cada job pide lo suyo (solo el despliegue puede escribir en Pages).
permissions:
  contents: read

# Una sola publicación a la vez; no se cancela una que ya está en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generar la web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 22 (la última 22.x) importa los .ts de src/ sin compilar: no hace falta npm ci.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Generar site/dist
        run: node scripts/build-site.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Lee la configuración de Pages con la API: va aquí, con los permisos de Pages (la generación solo lee el código).
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
