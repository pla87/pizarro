# Web del producto (getpizarro.com): genera el sitio estático con scripts/build-site.mjs (site/ → site/dist) y lo
# publica en GitHub Pages.
#
# IMPORTANTE (una sola vez, el propietario del repositorio): activar Pages en GitHub con
#   Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Sin eso, el paso de despliegue falla. El dominio (CNAME getpizarro.com), el DNS y «Enforce HTTPS» se explican en
# docs/VENTA.md, sección «Web getpizarro.com».
name: Web

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.mjs"
      - "LICENSE*.md"
      - "src/lib/product.ts"
      - "src/lib/landing-content.ts"
      - "src/lib/site-content.ts"
      - "src/lib/site-markdown.ts"
      - "src/lib/html-escape.ts"
      - "src/lib/search-accents.ts"
      - "docs/guias/**"
      - "docs/web/**"
      - "src/i18n/en/**"
      - "src/app/icon.svg"
      - "src/app/favicon.ico"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Lo mínimo por defecto; cada job pide lo suyo (solo el despliegue puede escribir en Pages).
permissions:
  contents: read

# Una sola publicación a la vez; no se cancela una que ya está en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generar la web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Node 22 (la última 22.x) importa los .ts de src/ sin compilar: no hace falta npm ci.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Generar site/dist
        run: node scripts/build-site.mjs

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Lee la configuración de Pages con la API: va aquí, con los permisos de Pages (la generación solo lee el código).
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
