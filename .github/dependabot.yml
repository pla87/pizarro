# Actualizaciones de dependencias propuestas por Dependabot (PR contra main). Cómo se revisan: docs/HANDOFF.md,
# «Actualizaciones de dependencias». Regla: una actualización solo se aprueba si pasan todas las pruebas.
version: 2
updates:
  # Acciones de GitHub de .github/workflows/: van fijadas a un commit exacto (SHA + «# vX.Y.Z»); Dependabot actualiza
  # el SHA y el comentario. Todas juntas en un solo PR a la semana.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    # Solo versiones publicadas hace al menos 7 días (da tiempo a que se detecten versiones rotas o comprometidas).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      acciones:
        patterns: ["*"]

  # Paquetes de npm (package.json / package-lock.json): una vez al mes, menores y parches en un solo PR. Las versiones
  # mayores no se proponen solas (suelen romper algo y se hacen a mano, leyendo sus notas). Las actualizaciones de
  # seguridad no esperan al calendario ni a estos límites: Dependabot las abre en cuanto se publica el aviso (requiere
  # «Dependabot security updates» activado en Settings → Code security), agrupadas en su propio PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    versioning-strategy: increase
    # Igual que en la actualización a mano: solo versiones con al menos 7 días. No afecta a las de seguridad.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      menores-y-parches:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      seguridad:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Mayores: a mano. Si un arreglo de seguridad exigiera subir de versión mayor, la alerta sigue saliendo en
      # Security → Dependabot y se hace a mano.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Imágenes base, fijadas por digest (etiqueta@sha256:…): la del Dockerfile (node:22-bookworm-slim) y las de
  # deploy/compose.yml (caddy:2-alpine y postgres:16-alpine). Dependabot propone el digest nuevo de la misma etiqueta
  # (parches de seguridad del sistema base). Misma cadencia y espera que las acciones. Nunca otra versión mayor: Node
  # se sube a mano, y PostgreSQL de la 16 a la 17 exige migrar los datos (la imagen nueva no abre el volumen viejo).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docker"
    groups:
      imagen-base:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docker"
    groups:
      imagenes-compose:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
